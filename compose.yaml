name: unmet
services:
  api:
    image: unmet-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Docker/Dockerfile.api
    environment:
      PAYMENT_DB_PATH: /data/payments.sqlite
      PAYMENT_RETENTION_DAYS: ${PAYMENT_RETENTION_DAYS:-30}
      PAYMENT_MAX_RECORDS: ${PAYMENT_MAX_RECORDS:-100000}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      CHAIN_ID: ${CHAIN_ID:-1952}
      XLAYER_RPC_URL: ${XLAYER_RPC_URL:?Configure XLAYER_RPC_URL}
      DEMAND_CONTRACT: ${DEMAND_CONTRACT:?Configure DEMAND_CONTRACT}
      DEMAND_DEPLOY_BLOCK: ${DEMAND_DEPLOY_BLOCK:-0}
      PAYMENT_TOKEN: ${PAYMENT_TOKEN:?Configure PAYMENT_TOKEN}
      X402_CHAIN_ID: ${X402_CHAIN_ID:?Set X402_CHAIN_ID=196 for production containers}
      OPPORTUNITY_PRICE: ${OPPORTUNITY_PRICE:-0.01}
      OKX_API_KEY: ${OKX_API_KEY:?Configure your own OKX_API_KEY}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:?Configure your own OKX_SECRET_KEY}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:?Configure your own OKX_PASSPHRASE}
      OKX_PAY_TO: ${OKX_PAY_TO:?Configure your own OKX_PAY_TO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Configure FRONTEND_ORIGIN}
      TRUSTED_PROXIES: ${CADDY_INTERNAL_IP:-172.30.80.2}/32
      RATE_WINDOW_MS: ${RATE_WINDOW_MS:-60000}
      RATE_DEMANDS: ${RATE_DEMANDS:-60}
      RATE_OPPORTUNITIES: ${RATE_OPPORTUNITIES:-20}
      RATE_MAX_KEYS: ${RATE_MAX_KEYS:-10000}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-16}
      RPC_MAX_IN_FLIGHT: ${RPC_MAX_IN_FLIGHT:-16}
      RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-5000}
      UPSTREAM_MAX_BYTES: ${UPSTREAM_MAX_BYTES:-2097152}
      INDEX_BATCH_SIZE: ${INDEX_BATCH_SIZE:-4}
      INDEX_MAX_DEMANDS: ${INDEX_MAX_DEMANDS:-10000}
      INDEX_MAX_LOG_WINDOWS: ${INDEX_MAX_LOG_WINDOWS:-100}
      INDEX_BUDGET_MS: ${INDEX_BUDGET_MS:-15000}
      INDEX_REFRESH_MS: ${INDEX_REFRESH_MS:-5000}
      DEPENDENCY_CACHE_MS: ${DEPENDENCY_CACHE_MS:-5000}
      FACILITATOR_TIMEOUT_MS: ${FACILITATOR_TIMEOUT_MS:-15000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
    volumes:
      - payment_data:/data
    expose:
      - "8787"
    networks:
      application:
        ipv4_address: ${API_INTERNAL_IP:-172.30.80.3}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8787/live'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 25s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    image: unmet-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Docker/Dockerfile.web
      args:
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-1952}
        VITE_XLAYER_RPC_URL: ${VITE_XLAYER_RPC_URL:?Configure public VITE_XLAYER_RPC_URL}
        VITE_DEMAND_CONTRACT: ${VITE_DEMAND_CONTRACT:?Configure VITE_DEMAND_CONTRACT}
        VITE_PAYMENT_TOKEN: ${VITE_PAYMENT_TOKEN:?Configure VITE_PAYMENT_TOKEN}
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID:?Configure public VITE_REOWN_PROJECT_ID}
        VITE_MARKET_SYNC_INTERVAL_MS: ${VITE_MARKET_SYNC_INTERVAL_MS:-60000}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      WWW_SITE_ADDRESS: ${WWW_SITE_ADDRESS:-http://localhost:8081}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:-http://localhost}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      - "${WEB_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    networks:
      application:
        ipv4_address: ${CADDY_INTERNAL_IP:-172.30.80.2}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  application:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.80.0/24}
volumes:
  payment_data:
  caddy_data:
  caddy_config:
