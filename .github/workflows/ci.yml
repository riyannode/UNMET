name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:frontend
      - run: bun run --cwd frontend typecheck
      - run: bun run build:frontend
        env:
          VITE_CHAIN_ID: "1952"
          VITE_XLAYER_RPC_URL: http://127.0.0.1:8545
          VITE_DEMAND_CONTRACT: "0x3333333333333333333333333333333333333333"
          VITE_PAYMENT_TOKEN: "0x4444444444444444444444444444444444444444"
          VITE_REOWN_PROJECT_ID: "00000000000000000000000000000000"

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:backend
      - run: bun run --cwd backend typecheck

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.3
          cache: false
      - name: Install pinned Solidity dependencies
        run: |
          mkdir -p backend/lib
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts.git backend/lib/openzeppelin-contracts
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std.git backend/lib/forge-std
          test "$(git -C backend/lib/openzeppelin-contracts rev-parse HEAD)" = 5fd1781b1454fd1ef8e722282f86f9293cacf256
          test "$(git -C backend/lib/forge-std rev-parse HEAD)" = 620536fa5277db4e3fd46772d5cbc1ea0696fb43
      - run: forge fmt --check
        working-directory: backend
      - run: forge build
        working-directory: backend
      - run: forge test -vv
        working-directory: backend

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ci-${{ github.sha }}
      XLAYER_RPC_URL: http://127.0.0.1:8545
      DEMAND_CONTRACT: "0x3333333333333333333333333333333333333333"
      PAYMENT_TOKEN: "0x4444444444444444444444444444444444444444"
      X402_CHAIN_ID: "196"
      X402_RPC_URL: http://127.0.0.1:8546
      OKX_API_KEY: ci-dummy-api-key
      OKX_SECRET_KEY: ci-dummy-secret-key
      OKX_PASSPHRASE: ci-dummy-passphrase
      OKX_PAY_TO: "0x5555555555555555555555555555555555555555"
      FRONTEND_ORIGIN: http://localhost
      VITE_CHAIN_ID: "1952"
      VITE_XLAYER_RPC_URL: http://127.0.0.1:8545
      VITE_DEMAND_CONTRACT: "0x3333333333333333333333333333333333333333"
      VITE_PAYMENT_TOKEN: "0x4444444444444444444444444444444444444444"
      VITE_REOWN_PROJECT_ID: "00000000000000000000000000000000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build api
      - run: docker compose build web
      - name: Smoke test packaged discovery routes
        run: |
          set -euo pipefail
          container="unmet-web-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp="$RUNNER_TEMP/unmet-web-discovery"
          mkdir -p "$temp/dist"
          docker create --name "$container" "unmet-web:${IMAGE_TAG}" >/dev/null
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$temp/caddy"
          docker cp "$container:/srv/." "$temp/dist/"
          chmod +x "$temp/caddy"
          CADDY_BIN="$temp/caddy" DIST_DIR="$temp/dist" python3 scripts/check-discovery.py
